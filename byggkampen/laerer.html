<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggkampen</title><style>*{box-sizing:border-box}body{margin:0;background:#102332;color:#f4f7fa;font:clamp(17px,2.2vw,32px) system-ui}main{max-width:1200px;margin:auto;padding:4vw}button,input{font:inherit;padding:.65em;border-radius:12px;border:0}button{background:#e9a13b;color:#142332;cursor:pointer;margin:.2em}button:disabled{opacity:.5}h1{font-size:clamp(32px,5vw,76px);line-height:1.1}h2{color:#a7e3d1}p{line-height:1.5}.panel{background:#203b4b;padding:1em;border-radius:18px;margin:1em 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.options button{text-align:left;background:#305a70;color:white}.names{display:flex;flex-wrap:wrap;gap:8px}.names span{background:#23684f;padding:.4em .7em;border-radius:30px}small{font-size:.65em}a{color:#a7e3d1}input{max-width:100%}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center} .bar{background:#426171;height:12px;border-radius:10px;overflow:hidden}.bar i{display:block;background:#65d6a4;height:100%}</style><main id="app"></main><script>const {slides,qs}={"slides":[["Glass og plast","To materialer – mange muligheter","Hva avgjør om et materiale passer på byggeplassen?"],["Hva er glass?","Silisiumdioksid (SiO₂) er hovedbestanddelen.","Glass er fast og amorft: atomene har ikke et regelmessig krystallmønster."],["Fra sand til glass","Kvartssand + soda + kalkstein + returglass","Smelting ved ca. 1400–1600 °C. Soda senker smeltetemperaturen; kalk gir kjemisk bestandighet."],["Hardt, men sprøtt","Glass slipper inn lys og har glatt, vanntett overflate.","Kantskader og riper kan svekke glass. Hardhet er ikke det samme som styrke."],["Tre typer glass","Vanlig: store skarpe skår. Herdet: mange små biter.","Laminert: mellomlaget holder bitene sammen. Rekkverk krever dokumentert løsning."],["Glassull","Tynne glassfibre holder luft i ro.","Brukes til varme- og lydisolasjon."],["Isolerglass","Flere glasslag, tette gassrom og ofte belegg.","Argon reduserer varmeoverføring. Karm og ramme har også betydning."],["U-verdi","Lav U-verdi = mindre varmetap.","Varmeeffekt = U × areal × temperaturforskjell. Enhet for U: W/(m² K)."],["Kondens","Inne: undersøk fukt, temperatur og ventilasjon.","Ute: kan være normalt. Mellom glasslag: tyder på svikt i kantforseglingen."],["HMS og glass","Planlegg løft, bruk egnet stativ og løfteutstyr.","Beskytt kanter, bruk egnet verneutstyr og sperr av ved fare for nedfall."],["Glass og miljø","Produksjon krever mye energi.","Lang levetid, lav U-verdi, reparasjon og riktig sortering kan redusere miljøbelastningen."],["Hva er plast?","Polymerer er lange molekylkjeder.","Mange plasttyper lages av olje og gass, noen av fornybare råstoffer."],["To plastfamilier","Termoplast: kan vanligvis myknes og formes på nytt.","Herdeplast: kan normalt ikke smeltes om etter herding."],["Plast på byggeplassen","Avløpsrør, kabelrør, membraner, fuktsperrer og isolasjon.","Riktig montering av skjøter og gjennomføringer er avgjørende."],["Fordeler og begrensninger","Ofte lett, formbar, fuktbestandig og elektrisk isolerende.","Vurder UV, kulde, varmeutvidelse, belastning og brann."],["Mikroplast","Plastpartikler mindre enn 5 mm.","Slitasje og oppdeling av avfall kan spre mikroplast. Samle opp kapp."],["Plast og bærekraft","Vurder hele livsløpet, ikke bare råstoffet.","Emballasje kan redusere matsvinn. Ombruk, holdbarhet og sortering teller."],["HMS og plast","Følg monteringsanvisninger og sikkerhetsdatablad.","Ventilasjon og verneutstyr ved lim, støv og røyk. Ikke brenn plastavfall."],["Finale","Velg riktig materiale til riktig jobb.","Tenk sikkerhet, funksjon, levetid og miljø."]],"qs":[[1,"Hva betyr amorf?",["Regelmessig krystallmønster","Ingen regelmessig krystallstruktur over lange avstander","Flytende ved romtemperatur","Laget av plast"],1,"Glass er et fast, amorft stoff."],[2,"Hvorfor tilsettes soda?",["For å senke smeltetemperaturen","For å lage luftbobler","For å gjøre glass magnetisk","For å herde glass"],0,"Soda gjør at blandingen kan smeltes ved lavere temperatur."],[3,"Hva kan svekke en glassrute?",["Dagslys","Argon","Kantskader","Ren luft"],2,"Kantskader kan gi spenningskonsentrasjoner."],[4,"Hva er viktigst ved valg av glassrekkverk?",["At glasset er billigst","At det er helt klart","At det er tynt","Dokumentert beskyttelse mot gjennomfall"],3,"Laminering og innfesting må passe til bruksområdet."],[4,"Hvordan knuser herdet glass vanligvis?",["I mange små biter","Det knuser aldri","I én stor bit","Det smelter"],0,"Små biter reduserer risikoen for alvorlige kutt."],[5,"Hvorfor isolerer glassull?",["Fibrene er varme","Fibrene holder luft i ro","Den inneholder argon","Den er vanntett"],1,"Stillestående luft reduserer varmeoverføring."],[6,"Hvorfor brukes argon i isolerglass?",["For å farge glasset","For å øke vekten","For å redusere varmeoverføring","For å hindre alle glassbrudd"],2,"Gassrommet bidrar til isolasjon."],[7,"U = 0,8, areal = 2 m², temperaturforskjell = 25 K. Varmetap?",["20 W","80 W","40 W","100 W"],2,"0,8 × 2 × 25 = 40 W."],[7,"Hvilket vindu har minst varmetap ved like forhold?",["U = 2,0","U = 0,7","U = 1,2","U = 3,0"],1,"Lavest U-verdi gir minst varmetap."],[8,"Dugg mellom glasslagene tyder på?",["God ventilasjon","Normal utvendig kondens","Råte i karmen er bevist","Svikt i kantforseglingen"],3,"Isolerruten kan være punktert."],[8,"Dugg på utsiden av et godt isolert vindu?",["Kan være normalt","Betyr alltid punktering","Betyr alltid råte","Krever alltid nytt vindu"],0,"Ytterglasset kan bli kaldere enn duggpunktet."],[9,"Hva gjør du før løft av en stor glassrute?",["Løfter alene","Planlegger løft og kontrollerer utstyret","Tester ved å slippe ruten","Fjerner sikringen"],1,"Planlegging og egnet utstyr reduserer risiko."],[10,"Punktert rute, men god karm. Hva bør vurderes?",["Brenne karmen","Bytte hele veggen","Bytte bare isolerruten","Male over duggen"],2,"Reparasjon kan spare materialer."],[11,"Hva heter lange molekylkjeder?",["Oksider","Krystaller","Mineraler","Polymerer"],3,"Polymerer består av mange sammenkoblede byggesteiner."],[12,"Hvilken plast kan vanligvis formes på nytt ved varme?",["Termoplast","Herdeplast","Alle plasttyper","Ingen plasttyper"],0,"Termoplast mykner ved oppvarming."],[13,"Hva er en viktig funksjon til en membran?",["Øke fukttransport","Begrense vanninntrenging","Lede strøm","Øke varmetap"],1,"Membraner beskytter mot vann og fukt."],[14,"Hvorfor må lange plastrør monteres etter anvisning?",["Plast ruster alltid","Plast tåler aldri vann","Temperatur kan endre lengden","Plast er alltid sprøtt"],2,"Varmeutvidelse må tas hensyn til."],[15,"Hva er mikroplast?",["Alle plastposer","Plast større enn 5 cm","Kun plast fra havet","Plastpartikler mindre enn 5 mm"],3,"Mikroplast kan oppstå ved slitasje og oppdeling."],[16,"Hva avgjør om papir eller plast er mest bærekraftig?",["Hele livsløpet og bruken","Bare fargen","Bare vekten","Bare råstoffets navn"],0,"Produksjon, transport, bruk og avfall må vurderes."],[17,"Hva er riktig ved arbeid med plastlim?",["Lukk all ventilasjon","Følg sikkerhetsdatablad og bruk egnet vern","Brenn rester","Ignorer produktinformasjon"],1,"Kjemiske produkter krever riktig håndtering."],[18,"Hvorfor kan glassfiberarmert plast være nyttig?",["Den er alltid gjenvinnbar","Den er alltid brannsikker","Fibrene kan forsterke plasten","Den består bare av glass"],2,"Kombinasjonen kan gi ønskede mekaniske egenskaper."],[18,"Hva er et godt materialvalg?",["Alltid billigst","Alltid plastfritt","Alltid tyngst","Dokumentert egnethet og vurdert livsløp"],3,"Funksjon, sikkerhet og miljø må ses sammen."]]};let s=0,q=-1,phase='slide',room='',peer,clients=new Map(),answers=new Map(),scores=new Map(),used=new Set();const app=document.querySelector('#app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function broadcast(){for(const [id,c] of clients)if(c.conn.open)c.conn.send({phase,q,question:phase==='question'?qs[q].slice(1,3):null,correct:phase==='result'?qs[q][3]:null,own:answers.get(id),score:scores.get(id)||0});}function start(i){q=i;phase='question';answers.clear();used.add(i);broadcast();render()}function end(){if(phase!=='question')return;phase='result';for(const [id,a] of answers)if(a===qs[q][3])scores.set(id,(scores.get(id)||0)+1);broadcast();render()}function move(n){s=Math.max(0,Math.min(slides.length-1,s+n));phase='slide';broadcast();render()}function render(){let x=slides[s],link=new URL('index.html',location.href);link.searchParams.set('rom',room);app.innerHTML='<header><small>BYGGKAMPEN · '+(room||'Kobler til…')+' · '+clients.size+' elever</small><button onclick="document.documentElement.requestFullscreen?.()">Fullskjerm</button></header>'+ (phase==='slide'?'<h1>'+x[0]+'</h1><div class="panel"><h2>'+x[1]+'</h2><p>'+x[2]+'</p></div>'+(s===0?'<p>Elever: åpne <a href="'+link+'">'+link+'</a></p><div id="qr"></div>':'')+qs.map((v,i)=>v[0]===s?'<button onclick="start('+i+')">'+(used.has(i)?'Gjenta':'Start')+' spørsmål '+(i+1)+'</button>':'').join(''):phase==='question'?'<h1>'+qs[q][1]+'</h1><div class="options">'+qs[q][2].map((a,i)=>'<div class="panel">'+ 'ABCD'[i]+'. '+a+'</div>').join('')+'</div><h2>'+answers.size+' / '+clients.size+' har svart</h2><button onclick="end()">Vis fasit</button>':'<h1>Riktig svar: '+ 'ABCD'[qs[q][3]]+'</h1><h2>'+qs[q][2][qs[q][3]]+'</h2><p>'+qs[q][4]+'</p>'+qs[q][2].map((a,i)=>{let n=[...answers.values()].filter(v=>v===i).length;return '<small>'+ 'ABCD'[i]+' · '+n+'</small><div class="bar"><i style="width:'+100*n/Math.max(1,answers.size)+'%"></i></div>'}).join('')+'<h2>Disse svarte riktig!</h2><div class="names">'+[...answers].filter(([id,a])=>a===qs[q][3]).map(([id])=>'<span>✓ '+esc(clients.get(id)?.name||'Elev')+'</span>').join('')+'</div><button onclick="phase=\'slide\';broadcast();render()">Tilbake til fagstoff</button>')+'<footer><button onclick="move(-1)">←</button> '+(s+1)+' / '+slides.length+' <button onclick="move(1)">→</button><button onclick="alert([...scores].sort((a,b)=>b[1]-a[1]).map(([id,p])=>(clients.get(id)?.name||\'Elev\')+\': \'+p).join(\'\\n\')||\'Ingen poeng ennå\')">Poeng</button></footer>';if(s===0&&phase==='slide'&&room&&window.QRCode)new QRCode(document.querySelector('#qr'),{text:link.href,width:160,height:160});}document.addEventListener('keydown',e=>{if(phase==='slide'&&e.key==='ArrowRight')move(1);if(phase==='slide'&&e.key==='ArrowLeft')move(-1)});function init(){room=crypto.randomUUID().slice(0,8);peer=new Peer('byggkamp-'+room);peer.on('open',render);peer.on('error',e=>{alert('Tilkoblingsfeil: '+e.type)});peer.on('connection',c=>{let id;c.on('data',d=>{if(d.type==='join'&&typeof d.id==='string'&&typeof d.name==='string'){id=d.id;clients.set(id,{name:d.name.slice(0,30),conn:c});broadcast();render()}if(d.type==='answer'&&id&&phase==='question'&&d.q===q&&!answers.has(id)&&Number.isInteger(d.a)&&d.a>=0&&d.a<4){answers.set(id,d.a);broadcast();render()}});c.on('close',()=>{if(id&&clients.get(id)?.conn===c){clients.delete(id);render()}})})}render();</script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-transport.js?v=1"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>if(window.Peer)init();else alert('Nettverksbibliotek kunne ikke lastes.')</script></html>
