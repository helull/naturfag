<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggkampen</title><style>*{box-sizing:border-box}body{margin:0;background:#102332;color:#f4f7fa;font:clamp(17px,2.2vw,32px) system-ui}main{max-width:1200px;margin:auto;padding:4vw}button,input{font:inherit;padding:.65em;border-radius:12px;border:0}button{background:#e9a13b;color:#142332;cursor:pointer;margin:.2em}button:disabled{opacity:.5}h1{font-size:clamp(32px,5vw,76px);line-height:1.1}h2{color:#a7e3d1}p{line-height:1.5}.panel{background:#203b4b;padding:1em;border-radius:18px;margin:1em 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.options button{text-align:left;background:#305a70;color:white}.names{display:flex;flex-wrap:wrap;gap:8px}.names span{background:#23684f;padding:.4em .7em;border-radius:30px}small{font-size:.65em}a{color:#a7e3d1}input{max-width:100%}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center} .bar{background:#426171;height:12px;border-radius:10px;overflow:hidden}.bar i{display:block;background:#65d6a4;height:100%}</style><main id="app"></main><script>const app=document.querySelector('#app');let room=new URLSearchParams(location.search).get('rom')||'',name='',peer,conn,state=null,id=sessionStorage.getItem('bygg-id')||crypto.randomUUID(),retry;sessionStorage.setItem('bygg-id',id);function render(){app.innerHTML='<h2>BYGGKAMPEN</h2>';if(!name){app.innerHTML+='<p>Romkode</p><input id="room" maxlength="8"><p>Fornavn eller kallenavn</p><input id="name" maxlength="30"><p><button onclick="join()">Bli med</button></p>';document.querySelector('#room').value=room;return}if(!state){app.innerHTML+='<h1>Kobler til…</h1><p>Vent på læreren.</p>';return}if(state.phase==='question'){app.innerHTML+='<h1 id="question"></h1><div class="options" id="opts"></div>';document.querySelector('#question').textContent=state.question[0];state.question[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent='ABCD'[i]+'. '+a;b.disabled=state.own!==undefined;b.onclick=()=>{conn.send({type:'answer',q:state.q,a:i});document.querySelectorAll('#opts button').forEach(x=>x.disabled=true)};document.querySelector('#opts').append(b)});if(state.own!==undefined)app.innerHTML+='<p>Svar registrert!</p>'}else if(state.phase==='result'){app.innerHTML+='<h1>'+(state.own===state.correct?'Riktig! 🎉':state.own===undefined?'Neste gang!':'Ikke helt denne gangen')+'</h1><p>Riktig alternativ: '+'ABCD'[state.correct]+'</p><p>Poeng: '+state.score+'</p>'}else app.innerHTML+='<h1>Følg med på skjermen</h1><p>Neste spørsmål kommer automatisk.</p>'}function join(){room=document.querySelector('#room').value.trim().toLowerCase();name=document.querySelector('#name').value.trim();if(!room||!name){name='';return}render();if(!window.Peer){app.textContent='Nettverksbibliotek kunne ikke lastes.';return}peer=new Peer();peer.on('open',connect);peer.on('error',e=>{state=null;render();app.innerHTML+='<p>Tilkoblingsfeil: '+String(e.type).replace(/[^a-z-]/g,'')+'</p>';schedule()})}function schedule(){clearTimeout(retry);retry=setTimeout(()=>{if(peer?.open)connect();else if(peer?.disconnected)peer.reconnect()},3000)}function connect(){if(conn?.open)return;conn=peer.connect('byggkamp-'+room,{reliable:true});conn.on('open',()=>conn.send({type:'join',id,name}));conn.on('data',d=>{state=d;render()});conn.on('close',()=>{state=null;render();schedule()});conn.on('error',e=>{app.innerHTML+='<p>Forbindelsesfeil. Prøver igjen.</p>';schedule()});setTimeout(()=>{if(!conn.open){app.innerHTML+='<p>Ingen kontakt med lærer etter 12 sekunder. Kontroller romkode og prøv gjerne mobilnett.</p>';conn.close();schedule()}},12000)}render();</script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script></html>
